name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  server:
    name: Server and shared projects
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore server
        run: dotnet restore Server/Server.csproj

      - name: Build server
        run: dotnet build Server/Server.csproj --configuration Release --no-restore

      - name: Test shared library
        run: dotnet test Tests/Shared.Tests/Shared.Tests.csproj --configuration Release

      - name: Test server
        run: dotnet test Tests/Server.Tests/Server.Tests.csproj --configuration Release

  console-windows:
    name: Windows console
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build desktop console
        run: dotnet build Console.Win/Console.Win.csproj --configuration Release

      - name: Publish desktop console
        run: dotnet publish Console.Win/Console.Win.csproj --configuration Release -p:PublishProfile=win-x64

      - name: Upload desktop console
        uses: actions/upload-artifact@v4
        with:
          name: Remotely-Console-win-x64
          path: Console.Win/bin/publish/win-x64/

  server-windows-package:
    name: Windows server package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Windows agent
        run: dotnet publish Agent/Agent.csproj --configuration Release --runtime win-x64 --self-contained true --output Agent/bin/publish/win-x64

      - name: Publish remote-control host
        run: dotnet publish Desktop.Win/Desktop.Win.csproj --configuration Release -p:PublishProfile=packaged-win-x64

      - name: Package Windows agent
        shell: pwsh
        run: Compress-Archive -Path "Agent/bin/publish/win-x64/*" -DestinationPath "Server/wwwroot/Content/Remotely-Win-x64.zip" -Force

      - name: Publish attended desktop client
        run: dotnet publish Desktop.Win/Desktop.Win.csproj --configuration Release -p:PublishProfile=desktop-win-x64

      - name: Publish Windows server
        shell: pwsh
        run: |
          dotnet publish Server/Server.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/server-win-x64
          Copy-Item -Path "Server/TestPackage/*" -Destination "artifacts/server-win-x64/" -Force

      - name: Upload Windows server
        uses: actions/upload-artifact@v4
        with:
          name: Remotely-Server-win-x64
          path: artifacts/server-win-x64/
