name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  server:
    name: Server and shared projects
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore server
        run: dotnet restore Server/Server.csproj

      - name: Build server
        run: dotnet build Server/Server.csproj --configuration Release --no-restore

      - name: Test shared library
        run: dotnet test Tests/Shared.Tests/Shared.Tests.csproj --configuration Release

      - name: Test server
        run: dotnet test Tests/Server.Tests/Server.Tests.csproj --configuration Release

  console-windows:
    name: Windows console
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build desktop console
        run: dotnet build Console.Win/Console.Win.csproj --configuration Release

      - name: Publish desktop console
        run: dotnet publish Console.Win/Console.Win.csproj --configuration Release -p:PublishProfile=win-x64

      - name: Upload desktop console
        uses: actions/upload-artifact@v4
        with:
          name: Remotely-Console-win-x64
          path: Console.Win/bin/publish/win-x64/
